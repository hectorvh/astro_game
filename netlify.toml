[build]
  command = "pnpm run build:netlify"

[build.environment]
  NODE_VERSION = "22"
  NEXT_PUBLIC_JERBOA_BACKEND = "memory"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/game-build/Build/*.wasm.br"
  [headers.values]
    Content-Type = "application/wasm"
    Content-Encoding = "br"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/game-build/Build/*.data.br"
  [headers.values]
    Content-Type = "application/octet-stream"
    Content-Encoding = "br"
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/game-build/Build/*.js.br"
  [headers.values]
    Content-Type = "application/javascript"
    Content-Encoding = "br"
    Cache-Control = "public, max-age=31536000, immutable"
