<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self'; connect-src 'self' blob: data: https:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Galaxy Drift</title>
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0c1220;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #unity-container,
      #unity-container.unity-desktop,
      #unity-container.unity-mobile {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
        transform: none;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #0c1220;
        outline: none;
        touch-action: none;
      }
      #unity-footer,
      #unity-loading-bar {
        display: none !important;
      }

      #game-loading {
        position: absolute;
        inset: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem;
        background:
          radial-gradient(ellipse 80% 50% at 50% 0%, rgba(47, 216, 255, 0.12), transparent 55%),
          radial-gradient(ellipse 60% 40% at 80% 80%, rgba(194, 79, 224, 0.1), transparent 50%),
          #0c1220;
        color: #e8f4ff;
        font-family: ui-sans-serif, system-ui, sans-serif;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.8s ease, visibility 0.8s ease;
      }
      #game-loading.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #game-loading-kicker {
        margin: 0;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #2fd8ff;
      }
      #game-loading-title {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3.25rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
        color: #c24fe0;
        text-shadow: 0 0 18px rgba(47, 216, 255, 0.35);
      }
      #game-loading-status {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        color: #9aa8b8;
      }
      #game-loading-track {
        width: min(22rem, 78vw);
        height: 0.55rem;
        overflow: hidden;
        border-radius: 999px;
        background: #2a2f3a;
        box-shadow: inset 0 0 0 1px rgba(47, 216, 255, 0.2);
      }
      #game-loading-fill {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #00c8ff, #2fe8b0);
        transition: width 0.18s ease-out;
      }
      #game-loading-pct {
        margin: 0;
        font-variant-numeric: tabular-nums;
        font-size: 0.95rem;
        font-weight: 700;
        color: #2fd8ff;
      }
      @media (prefers-reduced-motion: reduce) {
        #game-loading,
        #game-loading-fill {
          transition: none;
        }
      }

      /* Invisible hit target aligned to the pause-menu Exit button. */
      #pause-exit-hit {
        position: absolute;
        z-index: 25;
        left: 50%;
        top: 56.9%;
        width: 78%;
        height: 6.4%;
        min-height: 2.75rem;
        transform: translate(-50%, -50%);
        margin: 0;
        padding: 0;
        border: 0;
        background: transparent;
        opacity: 0;
        pointer-events: none;
        -webkit-tap-highlight-color: transparent;
      }
      #pause-exit-hit.is-on {
        pointer-events: auto;
        cursor: pointer;
      }
      @media (orientation: landscape) {
        #pause-exit-hit {
          top: 61.3%;
          width: 80%;
          height: 8.8%;
          min-height: 0;
        }
      }

    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="0"></canvas>
      <div id="unity-loading-bar" hidden>
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer"></div>
      <button type="button" id="pause-exit-hit" aria-label="Exit" tabindex="-1"></button>
      <div id="game-loading" role="status" aria-live="polite" aria-label="Loading Galaxy Drift">
        <p id="game-loading-kicker">Astro Bunny</p>
        <h1 id="game-loading-title">Galaxy Drift</h1>
        <p id="game-loading-status">Recalibrating star-charts…</p>
        <div id="game-loading-track">
          <div id="game-loading-fill"></div>
        </div>
        <p id="game-loading-pct">0%</p>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      canvas.setAttribute("tabindex", "0");
      canvas.focus();

      var overlay = document.querySelector("#game-loading");
      var fill = document.querySelector("#game-loading-fill");
      var pctLabel = document.querySelector("#game-loading-pct");
      var statusLabel = document.querySelector("#game-loading-status");
      var pauseExitHit = document.querySelector("#pause-exit-hit");
      var unityInstance = null;
      var pauseMenuOpen = false;
      // Unity Personal splash plays after createUnityInstance resolves (~2s).
      var SPLASH_MASK_MS = 2800;
      var KEY_HOLD_MS = 70;
      var SWIPE_PX = 48;
      var TAP_PX = 28;
      var DOUBLE_TAP_MS = 320;

      var keyMap = {
        left: { key: "ArrowLeft", code: "ArrowLeft", keyCode: 37 },
        right: { key: "ArrowRight", code: "ArrowRight", keyCode: 39 },
        fire: { key: " ", code: "Space", keyCode: 32 },
      };

      var gameKeys = {
        ArrowLeft: true,
        ArrowRight: true,
        ArrowUp: true,
        ArrowDown: true,
        " ": true,
        a: true,
        A: true,
        d: true,
        D: true,
        w: true,
        W: true,
      };

      function focusCanvas() {
        canvas.focus();
      }

      window.addEventListener("pointerdown", focusCanvas);
      window.addEventListener("click", focusCanvas);
      window.addEventListener("focus", focusCanvas);
      window.addEventListener(
        "keydown",
        function (event) {
          if (gameKeys[event.key]) event.preventDefault();
          if (document.activeElement !== canvas) canvas.focus();
        },
        true,
      );

      function setProgress(progress) {
        var pct = Math.max(0, Math.min(100, Math.round(progress * 100)));
        fill.style.width = pct + "%";
        pctLabel.textContent = pct + "%";
      }

      var didRequestExit = false;
      function requestExitToMap() {
        if (didRequestExit) return;
        didRequestExit = true;
        try {
          window.parent.postMessage({ type: "astroBunnyExit" }, "*");
        } catch (err) {}
      }

      function invokeUnityExit() {
        if (!unityInstance || typeof unityInstance.SendMessage !== "function") return;
        ["GameHUD", "PauseMenu"].forEach(function (objectName) {
          ["OnExitClicked", "OnExit"].forEach(function (method) {
            try {
              unityInstance.SendMessage(objectName, method);
            } catch (err) {}
          });
        });
      }

      function setPauseMenuOpen(open) {
        pauseMenuOpen = !!open;
        if (pauseExitHit) pauseExitHit.classList.toggle("is-on", pauseMenuOpen);
      }

      function togglePauseMenu() {
        setPauseMenuOpen(!pauseMenuOpen);
      }

      function canvasPoint(event) {
        var rect = canvas.getBoundingClientRect();
        if (!rect.width || !rect.height) return null;
        return {
          x: (event.clientX - rect.left) / rect.width,
          y: (event.clientY - rect.top) / rect.height,
        };
      }

      function hitPauseButton(pt) {
        /* Play/pause control is bottom-right, beside SCORE. */
        return pt.x > 0.76 && pt.y > 0.83;
      }

      function hitContinueButton(pt) {
        return pt.x > 0.12 && pt.x < 0.9 && pt.y > 0.39 && pt.y < 0.47;
      }

      function hitPauseCard(pt) {
        return pt.x > 0.1 && pt.x < 0.9 && pt.y > 0.1 && pt.y < 0.82;
      }

      function hookUnityExit(instance) {
        var module = instance && instance.Module;
        if (module) {
          var previousCleanup = module.QuitCleanup;
          module.QuitCleanup = function () {
            try {
              if (typeof previousCleanup === "function") previousCleanup();
            } finally {
              requestExitToMap();
            }
          };
        }

        var previousQuit = instance && instance.Quit;
        if (typeof previousQuit === "function") {
          instance.Quit = function () {
            return Promise.resolve(previousQuit.call(instance)).finally(requestExitToMap);
          };
        }

        window.setInterval(function () {
          if (module && module.shouldQuit) requestExitToMap();
        }, 250);
      }

      if (pauseExitHit) {
        pauseExitHit.addEventListener("pointerdown", function (event) {
          event.preventDefault();
          event.stopPropagation();
          invokeUnityExit();
          requestExitToMap();
        });
      }

      window.addEventListener(
        "keydown",
        function (event) {
          if (event.key === "Escape" || event.code === "Escape" || event.key === "Pause") {
            togglePauseMenu();
          }
        },
        true,
      );

      canvas.addEventListener(
        "pointerdown",
        function (event) {
          var pt = canvasPoint(event);
          if (!pt) return;
          if (hitPauseButton(pt)) {
            togglePauseMenu();
            return;
          }
          if (pauseMenuOpen && hitContinueButton(pt)) {
            setPauseMenuOpen(false);
            return;
          }
          if (pauseMenuOpen && !hitPauseCard(pt) && !hitPauseButton(pt)) {
            setPauseMenuOpen(false);
          }
        },
        true,
      );

      function hideOverlay() {
        overlay.classList.add("is-done");
        overlay.addEventListener(
          "transitionend",
          function () {
            overlay.style.display = "none";
          },
          { once: true },
        );
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          overlay.style.display = "none";
        }
        canvas.focus();
      }

      function emitKey(type, spec) {
        var eventInit = {
          key: spec.key,
          code: spec.code,
          keyCode: spec.keyCode,
          which: spec.keyCode,
          bubbles: true,
          cancelable: true,
          composed: true,
        };
        var event = new KeyboardEvent(type, eventInit);
        try {
          Object.defineProperty(event, "keyCode", { get: function () { return spec.keyCode; } });
          Object.defineProperty(event, "which", { get: function () { return spec.keyCode; } });
        } catch (err) {}
        window.dispatchEvent(event);
        document.dispatchEvent(event);
        canvas.dispatchEvent(event);
      }

      function tapAction(name) {
        var spec = keyMap[name];
        emitKey("keydown", spec);
        window.setTimeout(function () {
          emitKey("keyup", spec);
        }, KEY_HOLD_MS);
        if (name === "fire" && unityInstance) {
          ["BunnyRunning", "PlayerControllerX", "Player"].forEach(function (objectName) {
            ["ShootBlasters", "ShootBlaster"].forEach(function (method) {
              try {
                unityInstance.SendMessage(objectName, method);
              } catch (err) {}
            });
          });
        }
      }

      var swipeStart = null;
      var lastTapAt = 0;

      canvas.addEventListener(
        "touchstart",
        function (event) {
          if (!event.changedTouches.length) return;
          var t = event.changedTouches[0];
          swipeStart = { x: t.clientX, y: t.clientY };
        },
        { passive: true },
      );
      canvas.addEventListener(
        "touchend",
        function (event) {
          if (!swipeStart || !event.changedTouches.length) return;
          var t = event.changedTouches[0];
          var dx = t.clientX - swipeStart.x;
          var dy = t.clientY - swipeStart.y;
          swipeStart = null;

          if (Math.abs(dx) >= SWIPE_PX && Math.abs(dx) >= Math.abs(dy)) {
            lastTapAt = 0;
            tapAction(dx < 0 ? "left" : "right");
            return;
          }

          if (Math.abs(dx) > TAP_PX || Math.abs(dy) > TAP_PX) return;

          var now = Date.now();
          if (now - lastTapAt <= DOUBLE_TAP_MS) {
            lastTapAt = 0;
            tapAction("fire");
          } else {
            lastTapAt = now;
          }
        },
        { passive: true },
      );

      window.addEventListener(
        "touchmove",
        function (event) {
          event.preventDefault();
        },
        { passive: false },
      );

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type === "error") {
          div.style = "background: red; padding: 10px;";
        } else {
          if (type === "warning") div.style = "background: yellow; padding: 10px;";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/game-buildV7.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/game-buildV7.data.br",
        frameworkUrl: buildUrl + "/game-buildV7.framework.js.br",
        codeUrl: buildUrl + "/game-buildV7.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Spatial Paws Game",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          setProgress(progress);
        }).then(function (instance) {
          unityInstance = instance;
          hookUnityExit(instance);
          setProgress(1);
          statusLabel.textContent = "Starting Galaxy Drift…";
          setTimeout(hideOverlay, SPLASH_MASK_MS);
        }).catch(function (message) {
          statusLabel.textContent = message || "Could not start Galaxy Drift.";
          pctLabel.textContent = "";
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
