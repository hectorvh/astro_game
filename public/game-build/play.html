<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Galaxy Drift</title>
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0c1220;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #unity-container,
      #unity-container.unity-desktop,
      #unity-container.unity-mobile {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
        transform: none;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #0c1220;
        outline: none;
        touch-action: none;
      }
      #unity-footer,
      #unity-loading-bar {
        display: none !important;
      }

      #game-loading {
        position: absolute;
        inset: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem;
        background:
          radial-gradient(ellipse 80% 50% at 50% 0%, rgba(47, 216, 255, 0.12), transparent 55%),
          radial-gradient(ellipse 60% 40% at 80% 80%, rgba(194, 79, 224, 0.1), transparent 50%),
          #0c1220;
        color: #e8f4ff;
        font-family: ui-sans-serif, system-ui, sans-serif;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.8s ease, visibility 0.8s ease;
      }
      #game-loading.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #game-loading-kicker {
        margin: 0;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #2fd8ff;
      }
      #game-loading-title {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3.25rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
        color: #c24fe0;
        text-shadow: 0 0 18px rgba(47, 216, 255, 0.35);
      }
      #game-loading-status {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        color: #9aa8b8;
      }
      #game-loading-track {
        width: min(22rem, 78vw);
        height: 0.55rem;
        overflow: hidden;
        border-radius: 999px;
        background: #2a2f3a;
        box-shadow: inset 0 0 0 1px rgba(47, 216, 255, 0.2);
      }
      #game-loading-fill {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #00c8ff, #2fe8b0);
        transition: width 0.18s ease-out;
      }
      #game-loading-pct {
        margin: 0;
        font-variant-numeric: tabular-nums;
        font-size: 0.95rem;
        font-weight: 700;
        color: #2fd8ff;
      }
      @media (prefers-reduced-motion: reduce) {
        #game-loading,
        #game-loading-fill {
          transition: none;
        }
      }

    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="0"></canvas>
      <div id="unity-loading-bar" hidden>
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer"></div>
      <div id="game-loading" role="status" aria-live="polite" aria-label="Loading Galaxy Drift">
        <p id="game-loading-kicker">Astro Bunny</p>
        <h1 id="game-loading-title">Galaxy Drift</h1>
        <p id="game-loading-status">Recalibrating star-charts…</p>
        <div id="game-loading-track">
          <div id="game-loading-fill"></div>
        </div>
        <p id="game-loading-pct">0%</p>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      canvas.setAttribute("tabindex", "0");
      canvas.focus();

      var overlay = document.querySelector("#game-loading");
      var fill = document.querySelector("#game-loading-fill");
      var pctLabel = document.querySelector("#game-loading-pct");
      var statusLabel = document.querySelector("#game-loading-status");
      var unityInstance = null;
      // Unity Personal splash plays after createUnityInstance resolves (~2s).
      var SPLASH_MASK_MS = 2800;
      var KEY_HOLD_MS = 70;
      var SWIPE_PX = 48;
      var TAP_PX = 28;
      var DOUBLE_TAP_MS = 320;

      var keyMap = {
        left: { key: "ArrowLeft", code: "ArrowLeft", keyCode: 37 },
        right: { key: "ArrowRight", code: "ArrowRight", keyCode: 39 },
        fire: { key: " ", code: "Space", keyCode: 32 },
      };

      var gameKeys = {
        ArrowLeft: true,
        ArrowRight: true,
        ArrowUp: true,
        ArrowDown: true,
        " ": true,
        a: true,
        A: true,
        d: true,
        D: true,
        w: true,
        W: true,
      };

      function focusCanvas() {
        canvas.focus();
      }

      window.addEventListener("pointerdown", focusCanvas);
      window.addEventListener("click", focusCanvas);
      window.addEventListener("focus", focusCanvas);
      window.addEventListener(
        "keydown",
        function (event) {
          if (gameKeys[event.key]) event.preventDefault();
          if (document.activeElement !== canvas) canvas.focus();
        },
        true,
      );

      function setProgress(progress) {
        var pct = Math.max(0, Math.min(100, Math.round(progress * 100)));
        fill.style.width = pct + "%";
        pctLabel.textContent = pct + "%";
      }

      /* Shell contract: docs/unity-shell-contract.md in the web repo.
         Shell -> Unity: ?level=<1-4>&mode=<assessment|trial>&embed=1&muted=<0|1>&fs=<0|1>
         (Unity reads them from Application.absoluteURL), { type: "setMuted", muted } and
         { type: "fullscreenChanged", active }.
         Unity -> shell: levelComplete and exit(pause-menu) come straight from Unity
         (ShellBridge.jslib). This page only sends "ready" and exit(quit).
         Never send personal or research data through these messages. */
      var shellParams = new URLSearchParams(location.search);
      var shellMuted = shellParams.get("muted") === "1";

      function postToShell(message) {
        if (window.parent === window) return;
        try {
          window.parent.postMessage(message, location.origin);
        } catch (err) {}
      }

      // Last full-screen state from the shell (null until it sends one).
      var shellFullscreen = null;

      function setUnityFullscreen(active) {
        if (!unityInstance || typeof unityInstance.SendMessage !== "function") return;
        try {
          unityInstance.SendMessage("ShellBridge", "SetFullscreenFromShell", active ? "1" : "0");
        } catch (err) {}
      }

      function setUnityMuted(muted) {
        if (!unityInstance || typeof unityInstance.SendMessage !== "function") return;
        try {
          unityInstance.SendMessage("AudioManager", "SetMutedFromShell", muted ? "1" : "0");
        } catch (err) {}
      }

      /* AudioManager lives in the game scene, which loads after createUnityInstance
         resolves, so a SetMutedFromShell sent at "ready" is dropped ("SendMessage:
         object AudioManager not found"). Re-send the muted state over the first
         seconds. Unity starts unmuted, so this only runs while muted.
         TODO(added 2026-11-11): remove once AudioManager reads muted=1 from
         Application.absoluteURL in Awake (see docs/unity-shell-contract.md). */
      var SCENE_RETRY_MS = [500, 1500, 3000, 5000, 8000, 12000];
      function applyShellStateWhenSceneLoads() {
        SCENE_RETRY_MS.forEach(function (ms) {
          window.setTimeout(function () {
            if (shellMuted) setUnityMuted(true);
            // ShellBridge may not exist yet at "ready" either; re-apply the last known state.
            if (shellFullscreen !== null) setUnityFullscreen(shellFullscreen);
          }, ms);
        });
      }

      window.addEventListener("message", function (event) {
        if (event.source !== window.parent || event.origin !== location.origin) return;
        var data = event.data;
        if (!data) return;
        if (data.type === "setMuted") {
          shellMuted = !!data.muted;
          setUnityMuted(shellMuted);
        } else if (data.type === "fullscreenChanged") {
          shellFullscreen = !!data.active;
          setUnityFullscreen(shellFullscreen);
        }
      });

      /* Only for Unity's Application.Quit path (see hookUnityExit). The pause-menu
         Exit is posted by Unity itself. */
      var didRequestExit = false;
      function requestExitToMap(reason) {
        if (didRequestExit) return;
        didRequestExit = true;
        postToShell({ type: "exit", reason: reason });
        // TODO(added 2026-11-11): legacy message for older shells. Remove it in the
        // release after game-buildV10 ships.
        postToShell({ type: "astroBunnyExit" });
      }

      function hookUnityExit(instance) {
        var module = instance && instance.Module;
        if (module) {
          var previousCleanup = module.QuitCleanup;
          module.QuitCleanup = function () {
            try {
              if (typeof previousCleanup === "function") previousCleanup();
            } finally {
              requestExitToMap("quit");
            }
          };
        }

        var previousQuit = instance && instance.Quit;
        if (typeof previousQuit === "function") {
          instance.Quit = function () {
            return Promise.resolve(previousQuit.call(instance)).finally(function () {
              requestExitToMap("quit");
            });
          };
        }

        window.setInterval(function () {
          if (module && module.shouldQuit) requestExitToMap("quit");
        }, 250);
      }

      function hideOverlay() {
        overlay.classList.add("is-done");
        overlay.addEventListener(
          "transitionend",
          function () {
            overlay.style.display = "none";
          },
          { once: true },
        );
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          overlay.style.display = "none";
        }
        canvas.focus();
      }

      function emitKey(type, spec) {
        var eventInit = {
          key: spec.key,
          code: spec.code,
          keyCode: spec.keyCode,
          which: spec.keyCode,
          bubbles: true,
          cancelable: true,
          composed: true,
        };
        var event = new KeyboardEvent(type, eventInit);
        try {
          Object.defineProperty(event, "keyCode", { get: function () { return spec.keyCode; } });
          Object.defineProperty(event, "which", { get: function () { return spec.keyCode; } });
        } catch (err) {}
        window.dispatchEvent(event);
        document.dispatchEvent(event);
        canvas.dispatchEvent(event);
      }

      function tapAction(name) {
        var spec = keyMap[name];
        emitKey("keydown", spec);
        window.setTimeout(function () {
          emitKey("keyup", spec);
        }, KEY_HOLD_MS);
        if (name === "fire" && unityInstance) {
          ["BunnyRunning", "PlayerControllerX", "Player"].forEach(function (objectName) {
            ["ShootBlasters", "ShootBlaster"].forEach(function (method) {
              try {
                unityInstance.SendMessage(objectName, method);
              } catch (err) {}
            });
          });
        }
      }

      var swipeStart = null;
      var lastTapAt = 0;

      canvas.addEventListener(
        "touchstart",
        function (event) {
          if (!event.changedTouches.length) return;
          var t = event.changedTouches[0];
          swipeStart = { x: t.clientX, y: t.clientY };
        },
        { passive: true },
      );
      canvas.addEventListener(
        "touchend",
        function (event) {
          if (!swipeStart || !event.changedTouches.length) return;
          var t = event.changedTouches[0];
          var dx = t.clientX - swipeStart.x;
          var dy = t.clientY - swipeStart.y;
          swipeStart = null;

          if (Math.abs(dx) >= SWIPE_PX && Math.abs(dx) >= Math.abs(dy)) {
            lastTapAt = 0;
            tapAction(dx < 0 ? "left" : "right");
            return;
          }

          if (Math.abs(dx) > TAP_PX || Math.abs(dy) > TAP_PX) return;

          var now = Date.now();
          if (now - lastTapAt <= DOUBLE_TAP_MS) {
            lastTapAt = 0;
            tapAction("fire");
          } else {
            lastTapAt = now;
          }
        },
        { passive: true },
      );

      window.addEventListener(
        "touchmove",
        function (event) {
          event.preventDefault();
        },
        { passive: false },
      );

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type === "error") {
          div.style = "background: red; padding: 10px;";
        } else {
          if (type === "warning") div.style = "background: yellow; padding: 10px;";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/game-buildV11.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/game-buildV11.data.br",
        frameworkUrl: buildUrl + "/game-buildV11.framework.js.br",
        codeUrl: buildUrl + "/game-buildV11.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Astro Bunny",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          setProgress(progress);
        }).then(function (instance) {
          unityInstance = instance;
          hookUnityExit(instance);
          postToShell({ type: "ready" });
          if (shellMuted) setUnityMuted(true);
          applyShellStateWhenSceneLoads();
          setProgress(1);
          statusLabel.textContent = "Starting Galaxy Drift…";
          setTimeout(hideOverlay, SPLASH_MASK_MS);
        }).catch(function (message) {
          statusLabel.textContent = message || "Could not start Galaxy Drift.";
          pctLabel.textContent = "";
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
