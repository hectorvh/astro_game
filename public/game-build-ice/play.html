<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes">
    <title>Ice Moon</title>
    <link rel="stylesheet" href="TemplateData/style.css">
    <style>
      html, body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #0c1220;
        touch-action: none;
        -webkit-user-select: none;
        user-select: none;
      }
      #unity-container,
      #unity-container.unity-desktop,
      #unity-container.unity-mobile {
        position: fixed;
        inset: 0;
        width: 100%;
        height: 100%;
        left: 0;
        top: 0;
        transform: none;
      }
      #unity-canvas {
        width: 100%;
        height: 100%;
        display: block;
        background: #0c1220;
        outline: none;
        touch-action: none;
      }
      #unity-footer,
      #unity-loading-bar {
        display: none !important;
      }

      #game-loading {
        position: absolute;
        inset: 0;
        z-index: 30;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: 2rem;
        background:
          radial-gradient(ellipse 80% 50% at 50% 0%, rgba(47, 216, 255, 0.12), transparent 55%),
          radial-gradient(ellipse 60% 40% at 80% 80%, rgba(194, 79, 224, 0.1), transparent 50%),
          #0c1220;
        color: #e8f4ff;
        font-family: ui-sans-serif, system-ui, sans-serif;
        opacity: 1;
        visibility: visible;
        transition: opacity 0.8s ease, visibility 0.8s ease;
      }
      #game-loading.is-done {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }
      #game-loading-kicker {
        margin: 0;
        font-size: 0.75rem;
        font-weight: 700;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #2fd8ff;
      }
      #game-loading-title {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3.25rem);
        font-weight: 800;
        letter-spacing: -0.03em;
        line-height: 1;
        color: #c24fe0;
        text-shadow: 0 0 18px rgba(47, 216, 255, 0.35);
      }
      #game-loading-status {
        margin: 0;
        font-size: 1rem;
        font-weight: 600;
        color: #9aa8b8;
      }
      #game-loading-track {
        width: min(22rem, 78vw);
        height: 0.55rem;
        overflow: hidden;
        border-radius: 999px;
        background: #2a2f3a;
        box-shadow: inset 0 0 0 1px rgba(47, 216, 255, 0.2);
      }
      #game-loading-fill {
        width: 0%;
        height: 100%;
        border-radius: inherit;
        background: linear-gradient(90deg, #00c8ff, #2fe8b0);
        transition: width 0.18s ease-out;
      }
      #game-loading-pct {
        margin: 0;
        font-variant-numeric: tabular-nums;
        font-size: 0.95rem;
        font-weight: 700;
        color: #2fd8ff;
      }
      @media (prefers-reduced-motion: reduce) {
        #game-loading,
        #game-loading-fill {
          transition: none;
        }
      }

      #touch-controls {
        display: none;
        position: absolute;
        z-index: 20;
        left: 0;
        right: 0;
        bottom: 0;
        align-items: flex-end;
        justify-content: space-between;
        gap: 1rem;
        padding: 0.75rem 1.1rem max(1.25rem, env(safe-area-inset-bottom));
        pointer-events: none;
      }
      #touch-controls.is-on {
        display: flex;
      }
      #touch-controls button {
        pointer-events: auto;
        flex: 0 0 auto;
        min-width: 4.5rem;
        min-height: 4.5rem;
        padding: 0 1.1rem;
        border: 2px solid rgba(47, 216, 255, 0.45);
        border-radius: 1.25rem;
        background: rgba(26, 34, 51, 0.82);
        color: #e8f4ff;
        font-family: ui-sans-serif, system-ui, sans-serif;
        font-size: 1.7rem;
        font-weight: 800;
        line-height: 1;
        backdrop-filter: blur(8px);
        -webkit-tap-highlight-color: transparent;
      }
      #touch-controls button:active,
      #touch-controls button.is-down {
        background: rgba(0, 200, 255, 0.35);
        border-color: #2fd8ff;
      }
    </style>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <canvas id="unity-canvas" tabindex="0"></canvas>
      <div id="unity-loading-bar" hidden>
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"></div>
      <div id="unity-footer"></div>
      <div id="game-loading" role="status" aria-live="polite" aria-label="Loading Ice Moon">
        <p id="game-loading-kicker">Astro Bunny</p>
        <h1 id="game-loading-title">Ice Moon</h1>
        <p id="game-loading-status">Recalibrating star-charts…</p>
        <div id="game-loading-track">
          <div id="game-loading-fill"></div>
        </div>
        <p id="game-loading-pct">0%</p>
      </div>
      <div id="touch-controls" aria-label="Touch controls">
        <button type="button" id="touch-left" aria-label="Steer left">←</button>
        <button type="button" id="touch-right" aria-label="Steer right">→</button>
      </div>
    </div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      canvas.setAttribute("tabindex", "0");
      canvas.focus();

      var overlay = document.querySelector("#game-loading");
      var fill = document.querySelector("#game-loading-fill");
      var pctLabel = document.querySelector("#game-loading-pct");
      var statusLabel = document.querySelector("#game-loading-status");
      var touchPad = document.querySelector("#touch-controls");
      var unityInstance = null;
      // Unity Personal splash plays after createUnityInstance resolves (~2s).
      var SPLASH_MASK_MS = 2800;
      var KEY_HOLD_MS = 70;
      var SWIPE_PX = 48;
      var TAP_PX = 28;
      var DOUBLE_TAP_MS = 320;

      var keyMap = {
        left: { key: "ArrowLeft", code: "ArrowLeft", keyCode: 37 },
        right: { key: "ArrowRight", code: "ArrowRight", keyCode: 39 },
        fire: { key: " ", code: "Space", keyCode: 32 },
      };

      var gameKeys = {
        ArrowLeft: true,
        ArrowRight: true,
        ArrowUp: true,
        ArrowDown: true,
        " ": true,
        a: true,
        A: true,
        d: true,
        D: true,
        w: true,
        W: true,
      };

      function focusCanvas() {
        canvas.focus();
      }

      window.addEventListener("pointerdown", focusCanvas);
      window.addEventListener("click", focusCanvas);
      window.addEventListener("focus", focusCanvas);
      window.addEventListener(
        "keydown",
        function (event) {
          if (gameKeys[event.key]) event.preventDefault();
          if (document.activeElement !== canvas) canvas.focus();
        },
        true,
      );

      function setProgress(progress) {
        var pct = Math.max(0, Math.min(100, Math.round(progress * 100)));
        fill.style.width = pct + "%";
        pctLabel.textContent = pct + "%";
      }

      function hideOverlay() {
        overlay.classList.add("is-done");
        overlay.addEventListener(
          "transitionend",
          function () {
            overlay.style.display = "none";
          },
          { once: true },
        );
        if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) {
          overlay.style.display = "none";
        }
        if (wantsTouchPad()) touchPad.classList.add("is-on");
        canvas.focus();
      }

      function wantsTouchPad() {
        return (
          navigator.maxTouchPoints > 0 ||
          window.matchMedia("(pointer: coarse)").matches ||
          /iPhone|iPad|iPod|Android/i.test(navigator.userAgent)
        );
      }

      function emitKey(type, spec) {
        var eventInit = {
          key: spec.key,
          code: spec.code,
          keyCode: spec.keyCode,
          which: spec.keyCode,
          bubbles: true,
          cancelable: true,
          composed: true,
        };
        var event = new KeyboardEvent(type, eventInit);
        try {
          Object.defineProperty(event, "keyCode", { get: function () { return spec.keyCode; } });
          Object.defineProperty(event, "which", { get: function () { return spec.keyCode; } });
        } catch (err) {}
        window.dispatchEvent(event);
        document.dispatchEvent(event);
        canvas.dispatchEvent(event);
      }

      function tapAction(name) {
        var spec = keyMap[name];
        emitKey("keydown", spec);
        window.setTimeout(function () {
          emitKey("keyup", spec);
        }, KEY_HOLD_MS);
        if (name === "fire" && unityInstance) {
          ["BunnyRunning", "PlayerControllerX", "Player"].forEach(function (objectName) {
            ["ShootBlasters", "ShootBlaster"].forEach(function (method) {
              try {
                unityInstance.SendMessage(objectName, method);
              } catch (err) {}
            });
          });
        }
      }

      function bindHold(button, name) {
        var held = false;
        function down(event) {
          event.preventDefault();
          event.stopPropagation();
          if (held) return;
          held = true;
          button.classList.add("is-down");
          emitKey("keydown", keyMap[name]);
        }
        function up(event) {
          if (event) event.preventDefault();
          if (!held) return;
          held = false;
          button.classList.remove("is-down");
          emitKey("keyup", keyMap[name]);
        }
        button.addEventListener("pointerdown", down);
        button.addEventListener("pointerup", up);
        button.addEventListener("pointercancel", up);
        button.addEventListener("pointerleave", up);
      }

      bindHold(document.querySelector("#touch-left"), "left");
      bindHold(document.querySelector("#touch-right"), "right");

      var swipeStart = null;
      var lastTapAt = 0;

      canvas.addEventListener(
        "touchstart",
        function (event) {
          if (!event.changedTouches.length) return;
          var t = event.changedTouches[0];
          swipeStart = { x: t.clientX, y: t.clientY };
        },
        { passive: true },
      );
      canvas.addEventListener(
        "touchend",
        function (event) {
          if (!swipeStart || !event.changedTouches.length) return;
          var t = event.changedTouches[0];
          var dx = t.clientX - swipeStart.x;
          var dy = t.clientY - swipeStart.y;
          swipeStart = null;

          if (Math.abs(dx) >= SWIPE_PX && Math.abs(dx) >= Math.abs(dy)) {
            lastTapAt = 0;
            tapAction(dx < 0 ? "left" : "right");
            return;
          }

          if (Math.abs(dx) > TAP_PX || Math.abs(dy) > TAP_PX) return;

          var now = Date.now();
          if (now - lastTapAt <= DOUBLE_TAP_MS) {
            lastTapAt = 0;
            tapAction("fire");
          } else {
            lastTapAt = now;
          }
        },
        { passive: true },
      );

      window.addEventListener(
        "touchmove",
        function (event) {
          event.preventDefault();
        },
        { passive: false },
      );

      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? "block" : "none";
        }
        var div = document.createElement("div");
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type === "error") {
          div.style = "background: red; padding: 10px;";
        } else {
          if (type === "warning") div.style = "background: yellow; padding: 10px;";
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/game-buildV6.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/game-buildV6.data",
        frameworkUrl: buildUrl + "/game-buildV6.framework.js",
        codeUrl: buildUrl + "/game-buildV6.wasm",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "Spatial Paws Game",
        productVersion: "0.1.0",
        showBanner: unityShowBanner,
      };

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";
      }

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          setProgress(progress);
        }).then(function (instance) {
          unityInstance = instance;
          setProgress(1);
          statusLabel.textContent = "Starting Ice Moon…";
          setTimeout(hideOverlay, SPLASH_MASK_MS);
        }).catch(function (message) {
          statusLabel.textContent = message || "Could not start Ice Moon.";
          pctLabel.textContent = "";
        });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
